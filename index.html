<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Inventarisasi Aset Desa Wuliwutik — Kecamatan Nita</title>
  <style>
    :root {
      --bg-app: #f4f3ff;
      --bg-surface: #ffffff;
      --bg-soft: #f8f7ff;
      --text-main: #1e1b4b;
      --text-muted: #64748b;
      --border-light: #e2e8f0;
      --primary: #6d28d9;
      --primary-dark: #4c1d95;
      --primary-mid: #7c3aed;
      --primary-soft: #ede9fe;
      --success: #059669;
      --success-soft: #d1fae5;
      --warning: #d97706;
      --warning-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --info: #0284c7;
      --info-soft: #e0f2fe;
      --shadow-sm: 0 2px 10px rgba(76, 29, 149, 0.05);
      --shadow-md: 0 10px 25px rgba(76, 29, 149, 0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 82px;
      background: #ffffff;
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 8px;
      gap: 12px;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 30;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #5b21b6, #8b5cf6);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 8px 18px rgba(109, 40, 217, 0.28);
      margin-bottom: 6px;
      cursor: pointer;
    }

    .nav-btn {
      width: 64px;
      min-height: 54px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: transparent;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      transition: all 0.18s ease;
      padding: 4px;
      text-align: center;
      line-height: 1.15;
    }

    .nav-btn span.icon {
      font-size: 17px;
      line-height: 1;
    }

    .nav-btn:hover {
      background: var(--bg-soft);
      color: var(--primary);
    }

    .nav-btn.active {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-color: #ddd6fe;
    }

    .nav-btn.danger-nav:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .nav-btn.danger-nav.active {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #fecaca;
    }

    .sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    /* Main Area */
    .main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-light);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      max-width: 460px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 14px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .code-badge {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border: 1px solid #ddd6fe;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .conn-pill.demo {
      background: var(--warning-soft);
      color: #92400e;
      border-color: #fde68a;
    }

    .conn-pill.live {
      background: var(--success-soft);
      color: #065f46;
      border-color: #a7f3d0;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 10px 4px 5px;
      border-radius: 999px;
      background: #f8fafc;
      border: 1px solid var(--border-light);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6d28d9, #a855f7);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .user-meta {
      line-height: 1.15;
    }

    .user-meta strong {
      display: block;
      font-size: 12px;
    }

    .user-meta small {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .content-container {
      padding: 22px 24px 48px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: 11px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6d28d9, #7c3aed);
      color: #fff;
      box-shadow: 0 6px 16px rgba(109, 40, 217, 0.24);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #5b21b6, #6d28d9);
    }

    .btn-light {
      background: #ffffff;
      color: var(--text-main);
      border-color: #cbd5e1;
    }

    .btn-light:hover:not(:disabled) {
      background: #f8fafc;
    }

    .btn-soft-purple {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-color: #ddd6fe;
    }

    .btn-soft-purple:hover:not(:disabled) {
      background: #ddd6fe;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover:not(:disabled) {
      background: #b91c1c;
    }

    .btn-soft-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #fecaca;
    }

    .btn-soft-danger:hover:not(:disabled) {
      background: #fecaca;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* Hero + KPI */
    .top-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    .hero-card {
      background: linear-gradient(130deg, #4c1d95 0%, #6d28d9 52%, #7e22ce 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .hero-card h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.28;
      margin-bottom: 8px;
    }

    .hero-card p {
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.92);
      max-width: 640px;
    }

    .hero-total-box {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 12px 16px;
      margin-top: 12px;
      display: inline-block;
    }

    .hero-total-box small {
      display: block;
      font-size: 11.5px;
      opacity: 0.9;
    }

    .hero-total-box strong {
      font-size: 22px;
      font-weight: 800;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .kpi-badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .kpi-val {
      font-size: 23px;
      font-weight: 800;
      color: var(--text-main);
    }

    .kpi-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Section Head */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 12px;
      flex-wrap: wrap;
    }

    .section-head h2 {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
    }

    .section-head p {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* Category Cards */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .cat-card {
      border-radius: 16px;
      padding: 16px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 154px;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      box-shadow: var(--shadow-sm);
    }

    .cat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .cat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
    }

    .cat-pill {
      background: rgba(255, 255, 255, 0.22);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .cat-title {
      font-size: 15.5px;
      font-weight: 800;
      margin-top: 8px;
    }

    .cat-desc {
      font-size: 11.5px;
      opacity: 0.92;
      margin-top: 2px;
    }

    .cat-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 12px;
      font-weight: 700;
    }

    /* Cards & Charts */
    .panel-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .card-header h3 {
      font-size: 15.5px;
      font-weight: 800;
    }

    .segmented {
      display: inline-flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }

    .segmented button {
      border: none;
      background: transparent;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }

    .segmented button.active {
      background: #ffffff;
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    /* Filter & Tables */
    .filter-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .form-control,
    select.form-control,
    textarea.form-control {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-light);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.8px;
      background: #ffffff;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
      text-align: left;
      padding: 11px 12px;
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
    }

    td {
      padding: 11px 12px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
    }

    tr:hover td {
      background: #faf9ff;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .st-baik { background: var(--success-soft); color: #065f46; }
    .st-ringan { background: var(--warning-soft); color: #92400e; }
    .st-berat { background: var(--danger-soft); color: #991b1b; }
    .st-info { background: var(--info-soft); color: #075985; }
    .st-purple { background: var(--primary-soft); color: var(--primary-dark); }

    .reg-stacked {
      font-family: "Courier New", monospace;
      font-size: 11px;
      line-height: 1.35;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 5px 7px;
      display: inline-block;
    }

    .reg-top {
      border-bottom: 1px dashed #94a3b8;
      padding-bottom: 2px;
      margin-bottom: 2px;
      font-weight: 700;
      color: #1e293b;
    }

    .reg-bot {
      font-weight: 700;
      color: #4c1d95;
    }

    /* Form Layout */
    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .form-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 12.5px;
      font-weight: 700;
      color: #334155;
    }

    .form-group small {
      font-size: 11px;
      color: var(--text-muted);
    }

    .photo-preview-box {
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      background: #f8fafc;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      text-align: center;
    }

    .photo-preview-box img {
      max-height: 190px;
      max-width: 100%;
      border-radius: 10px;
      object-fit: cover;
    }

    .thumb-mini {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #e2e8f0;
    }

    /* Subtabs & Reports */
    .subtabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .subtab-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .subtab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .report-paper {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 26px;
    }

    .kop-surat {
      text-align: center;
      border-bottom: 3px double #1e293b;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .kop-surat h4 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .kop-surat h3 {
      font-size: 17px;
      text-transform: uppercase;
      margin: 2px 0;
    }

    .kop-surat p {
      font-size: 12px;
      color: #475569;
    }

    .ttd-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px 36px;
      margin-top: 26px;
      font-size: 12.5px;
    }

    .ttd-box {
      text-align: center;
    }

    .ttd-space {
      height: 64px;
    }

    /* Juknis Steps Grid */
    .juknis-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .juknis-step {
      background: #f8f7ff;
      border: 1px solid #ddd6fe;
      border-radius: 14px;
      padding: 16px;
    }

    .juknis-step h4 {
      color: var(--primary-dark);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .juknis-step ul {
      padding-left: 18px;
      font-size: 12.5px;
      color: #334155;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.52);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 18px;
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #1e1b4b;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.25);
      z-index: 200;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.22s ease;
      pointer-events: none;
      max-width: 380px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    pre.code-block {
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 12px;
      font-size: 12px;
      overflow-x: auto;
      max-height: 440px;
      line-height: 1.45;
    }

    @media (max-width: 1080px) {
      .top-grid,
      .panel-grid,
      .juknis-grid {
        grid-template-columns: 1fr;
      }
      .cat-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .filter-bar {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 720px) {
      .sidebar {
        width: 64px;
        padding: 12px 4px;
      }
      .nav-btn {
        width: 54px;
        font-size: 9px;
      }
      .content-container {
        padding: 14px;
      }
      .cat-grid,
      .kpi-grid,
      .form-grid-2,
      .form-grid-3,
      .ttd-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .sidebar,
      .topbar,
      .no-print,
      .subtabs,
      .btn {
        display: none !important;
      }
      body,
      .content-container,
      .card,
      .report-paper {
        background: #ffffff !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->

    function loadInitialState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            settings: { ...SEED_STATE.settings, ...(parsed.settings || {}) },
            assets: Array.isArray(parsed.assets) ? parsed.assets : SEED_STATE.assets,
            deletedAssets: Array.isArray(parsed.deletedAssets) ? parsed.deletedAssets : [],
            baLogs: Array.isArray(parsed.baLogs) && parsed.baLogs.length ? parsed.baLogs : SEED_STATE.baLogs
          };
        }
      } catch (e) {
        console.error(e);
      }
      return JSON.parse(JSON.stringify(SEED_STATE));
    }

    function buildKodeLokasiFromSettings(s) {
      const p = String(s.kode_provinsi || "53").padStart(2, "0").slice(0, 2);
      const k = String(s.kode_kabupaten || "07").padStart(2, "0").slice(0, 2);
      const kec = String(s.kode_kecamatan || "04").padStart(2, "0").slice(0, 2);
      const st = String(s.kode_status_desa || "2").padStart(1, "0").slice(0, 1);
      const urut = String(s.no_urut_desa || "006").padStart(3, "0").slice(0, 3);
      return `${p}.${k}.${kec}.${st}${urut}`;
    }

    function formatRupiah(num) {
      return "Rp " + Number(num || 0).toLocaleString("id-ID");
    }

    function getAssetEffectiveValue(asset) {
      const perolehan = Number(asset.nilai_perolehan || 0);
      const wajar = Number(asset.nilai_wajar_taksiran || 0);
      if (asset.metode_penilaian === "Belum Dinilai / CaLK") return 0;
      if (perolehan > 0) return perolehan;
      return wajar;
    }

    function extractGoogleDriveId(url) {
      if (!url) return "";
      const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]{10,})/,
        /[?&]id=([a-zA-Z0-9_-]{10,})/,
        /\/d\/([a-zA-Z0-9_-]{10,})/
      ];
      for (const re of patterns) {
        const m = String(url).match(re);
        if (m && m[1]) return m[1];
      }
      return "";
    }

    function getPhotoDisplayUrl(asset) {
      if (asset.foto_thumbnail_url && asset.foto_thumbnail_url.startsWith("data:image")) {
        return asset.foto_thumbnail_url;
      }
      const fileId = asset.foto_gdrive_file_id || extractGoogleDriveId(asset.foto_gdrive_url);
      if (fileId) {
        return `https://lh3.googleusercontent.com/d/${fileId}=w600`;
      }
      return asset.foto_gdrive_url || "";
    }

    function showToast(message, type = "info") {
      const box = document.getElementById("toast-box");
      box.textContent = message;
      box.style.background = type === "error" ? "#991b1b" : type === "success" ? "#065f46" : "#1e1b4b";
      box.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => box.classList.remove("show"), 3400);
    }

    function switchView(viewName) {
      currentView = viewName;
      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === viewName);
      });
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openInputView(editId = null) {
      currentView = "input";
      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === "input");
      });
      renderCurrentView(editId);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleGlobalSearch(val) {
      globalSearchQuery = val.trim().toLowerCase();
      if (currentView !== "inventory" && currentView !== "dashboard") {
        switchView("inventory");
      } else {
        renderCurrentView();
      }
    }

    function getFilteredAssets() {
      return appState.assets.filter((a) => {
        if (selectedCategoryFilter !== "ALL" && String(a.golongan) !== String(selectedCategoryFilter)) {
          return false;
        }
        if (globalSearchQuery) {
          const hay = [
            a.kode_barang,
            a.kode_lokasi,
            a.kode_pengguna,
            a.tahun_perolehan,
            a.no_urut_pendaftaran,
            a.nama_aset,
            a.kelompok_juknis,
            a.sub_jenis_aset,
            a.kategori_kib,
            a.lokasi_fisik_ruangan,
            a.merk_tipe_spesifikasi,
            a.penanggung_jawab
          ].join(" ").toLowerCase();
          if (!hay.includes(globalSearchQuery)) return false;
        }
        return true;
      });
    }

    function renderCurrentView(editId = null) {
      updateTopbarStatus();
      const container = document.getElementById("app-content");
      if (currentView === "dashboard") {
        container.innerHTML = renderDashboardView();
      } else if (currentView === "inventory") {
        container.innerHTML = renderInventoryListView();
      } else if (currentView === "input") {
        container.innerHTML = renderInputFormView(editId);
        initInputFormEvents(editId);
      } else if (currentView === "deletion") {
        container.innerHTML = renderDeletionView();
      } else if (currentView === "reports") {
        container.innerHTML = renderReportsView();
      } else if (currentView === "settings") {
        container.innerHTML = renderSettingsView();
      }
    }

    function renderBarChartSvg() {
      const entries = Object.entries(GOLONGAN_META).map(([gol]) => {
        const list = appState.assets.filter((a) => String(a.golongan) === gol);
        const val = chartMode === "count"
          ? list.length
          : list.reduce((s, a) => s + getAssetEffectiveValue(a), 0) / 1000000;
        return { gol, label: `G${gol}`, val: Number(val.toFixed(1)) };
      });
      const maxVal = Math.max(1, ...entries.map((e) => e.val));
      const barW = 46;
      const gap = 22;
      const svgW = entries.length * (barW + gap) + 40;
      const svgH = 210;
      const baseY = 172;

      const bars = entries.map((e, i) => {
        const h = Math.round((e.val / maxVal) * 120);
        const x = 28 + i * (barW + gap);
        const y = baseY - h;
        return `
          <text x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">${e.val}</text>
          <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="7" fill="#7c3aed"></rect>
          <text x="${x + barW / 2}" y="${baseY + 18}" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">${e.label}</text>
        `;
      }).join("");

      return `
        <div style="overflow-x:auto;">
          <svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">
            <line x1="20" y1="${baseY}" x2="${svgW - 10}" y2="${baseY}" stroke="#cbd5e1" stroke-width="1.5"></line>
            ${bars}
          </svg>
        </div>
      `;
    }

    function initInputFormEvents(editId) {
      updateRegisterPreview();
      if (!editId) {
        onGolonganChange(false);
      }
    }

    function onGolonganChange(overwriteCode = true) {
      const gol = document.getElementById("inp-golongan").value;
      const subSel = document.getElementById("inp-subjenis");
      const subs = SUB_JENIS_BY_GOLONGAN[gol] || ["Umum"];
      subSel.innerHTML = subs.map((s) => `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join("");
      if (overwriteCode && GOLONGAN_META[gol]) {
        document.getElementById("inp-kode-barang").value = GOLONGAN_META[gol].presetCode;
      }
      updateRegisterPreview();
    }

    function updateRegisterPreview() {
      const el = document.getElementById("register-live-preview");
      if (!el) return;
      const loc = appState.settings.kode_lokasi_10_digit;
      const [pengCode] = (document.getElementById("inp-pengguna")?.value || "01|Pemerintahan Desa").split("|");
      const yr = document.getElementById("inp-tahun")?.value || appState.settings.tahun_inventarisasi_aktif;
      const kb = document.getElementById("inp-kode-barang")?.value || "3.02.01.04.001";
      const urut = String(document.getElementById("inp-nourut")?.value || "1").padStart(6, "0");

      el.innerHTML = `
        <div class="reg-top">${escapeHtml(loc)} • ${escapeHtml(pengCode)} • ${escapeHtml(yr)}</div>
        <div class="reg-bot">${escapeHtml(kb)} • ${escapeHtml(urut)}</div>
      `;
    }

    function updatePhotoPreviewFromInput() {
      const url = document.getElementById("inp-foto-url").value.trim();
      const fileId = extractGoogleDriveId(url);
      document.getElementById("detected-drive-id").textContent = fileId || "-";
      const box = document.getElementById("form-photo-preview");
      if (!url) {
        box.innerHTML = `<span style="font-size:12.5px;color:var(--text-muted)">Pratinjau dokumentasi foto fisik aset akan tampil di sini.</span>`;
        return;
      }
      const imgSrc = fileId ? `https://lh3.googleusercontent.com/d/${fileId}=w600` : url;
      box.innerHTML = `<img src="${escapeAttr(imgSrc)}" alt="Pratinjau Foto" onerror="this.outerHTML='<small style=color:#92400e>Tautan tersimpan. Pastikan izin berbagi file Google Drive aktif untuk melihat gambar langsung.</small>'" />`;
    }

    let pendingSubmitMode = "list";
    function setPendingSubmitMode(mode) {
      pendingSubmitMode = mode;
    }

    async function handleLocalPhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function (e) {
        const base64Data = e.target.result;
        tempUploadedPhotoBase64 = base64Data;
        const box = document.getElementById("form-photo-preview");
        box.innerHTML = `<img src="${base64Data}" alt="Foto Lokal" /><small style="color:var(--text-muted)">Foto lokal siap disimpan</small>`;

        const gasUrl = (appState.settings.gas_webapp_url || "").trim();
        if (gasUrl.startsWith("http")) {
          showToast("Mengunggah foto ke Google Drive Desa Wuliwutik...", "info");
          try {
            const namaAset = (document.getElementById("inp-nama").value || "aset_wuliwutik").replace(/[^a-zA-Z0-9_-]/g, "_");
            const res = await fetch(gasUrl, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({
                action: "UPLOAD_PHOTO",
                folderUrl: appState.settings.folder_gdrive_foto_url || "",
                fileName: `${namaAset}_${Date.now()}.jpg`,
                mimeType: file.type || "image/jpeg",
                base64Data: base64Data
              })
            });
            const data = await res.json();
            if (data.status === "ok" && data.url) {
              document.getElementById("inp-foto-url").value = data.url;
              document.getElementById("detected-drive-id").textContent = data.fileId || "-";
              showToast("Foto berhasil diunggah ke Google Drive & tautan terisi otomatis!", "success");
            }
          } catch (err) {
            console.error(err);
            showToast("Gagal unggah langsung ke Drive; pratinjau lokal tetap disimpan.", "warning");
          }
        } else {
          showToast("Foto lokal dimuat ke pratinjau.", "success");
        }
      };
      reader.readAsDataURL(file);
    }

    async function handleSaveAsset(e) {
      e.preventDefault();
      const editId = document.getElementById("edit-asset-id").value;
      const gol = document.getElementById("inp-golongan").value;
      const meta = GOLONGAN_META[gol] || GOLONGAN_META["3"];
      const [kodePengguna, namaPengguna] = document.getElementById("inp-pengguna").value.split("|");
      const gdriveUrl = document.getElementById("inp-foto-url").value.trim();
      const gdriveFileId = extractGoogleDriveId(gdriveUrl);
      const prevAsset = editId ? appState.assets.find((x) => x.id_aset === editId) : null;

      const assetObj = {
        id_aset: editId || "AST-WWT-" + String(Date.now()).slice(-6),
        golongan: gol,
        kode_barang: document.getElementById("inp-kode-barang").value.trim(),
        kode_lokasi: appState.settings.kode_lokasi_10_digit,
        kode_pengguna: kodePengguna,
        nama_pengguna_barang: namaPengguna,
        tahun_perolehan: String(document.getElementById("inp-tahun").value).trim(),
        no_urut_pendaftaran: String(document.getElementById("inp-nourut").value).padStart(6, "0"),
        kelompok_juknis: meta.name,
        sub_jenis_aset: document.getElementById("inp-subjenis").value,
        kategori_kib: meta.kib,
        nama_aset: document.getElementById("inp-nama").value.trim(),
        merk_tipe_spesifikasi: document.getElementById("inp-spesifikasi").value.trim(),
        jumlah_luas_volume: Number(document.getElementById("inp-jumlah").value) || 1,
        satuan: document.getElementById("inp-satuan").value.trim(),
        asal_usul: document.getElementById("inp-asal").value,
        tanggal_perolehan: document.getElementById("inp-tanggal").value,
        nilai_perolehan: Number(document.getElementById("inp-nilai").value) || 0,
        nilai_wajar_taksiran: Number(document.getElementById("inp-nilai-wajar").value) || 0,
        metode_penilaian: document.getElementById("inp-metode-nilai").value,
        kondisi: document.getElementById("inp-kondisi").value,
        lokasi_fisik_ruangan: document.getElementById("inp-lokasi-fisik").value.trim(),
        penanggung_jawab: document.getElementById("inp-pj").value.trim(),
        status_dokumen: document.getElementById("inp-status-dokumen").value,
        no_dokumen_ba: document.getElementById("inp-nodokumen").value.trim(),
        catatan_klarifikasi_calk: document.getElementById("inp-catatan").value.trim(),
        status_label: document.getElementById("inp-status-label").value,
        foto_gdrive_url: gdriveUrl,
        foto_gdrive_file_id: gdriveFileId,
        foto_thumbnail_url: tempUploadedPhotoBase64 || (prevAsset ? prevAsset.foto_thumbnail_url : ""),
        tanggal_update: new Date().toISOString().slice(0, 10)
      };

      if (editId) {
        const idx = appState.assets.findIndex((a) => a.id_aset === editId);
        if (idx !== -1) appState.assets[idx] = assetObj;
        showToast(`Data aset "${assetObj.nama_aset}" diperbarui.`, "success");
      } else {
        appState.assets.unshift(assetObj);
        showToast(`Aset "${assetObj.nama_aset}" berhasil ditambahkan.`, "success");
      }

      saveStateToStorage();
      await pushActionToGas({ action: editId ? "UPDATE_ASSET" : "ADD_ASSET", asset: assetObj });

      if (pendingSubmitMode === "again") {
        openInputView(null);
      } else {
        switchView("inventory");
      }
    }

    /* ================= DELETION VIEW ================= */
    function renderDeletionView() {
      const activeRows = appState.assets.map((a) => {
        const checked = selectedDeleteIds.has(a.id_aset) ? "checked" : "";
        return `
          <tr>
            <td><input type="checkbox" ${checked} onchange="toggleDeleteSelection('${a.id_aset}', this.checked)" /></td>
            <td><strong>${escapeHtml(a.kode_barang)}</strong><br/><small style="color:var(--text-muted)">${escapeHtml(a.kode_lokasi)} • ${escapeHtml(String(a.no_urut_pendaftaran).padStart(6, "0"))}</small></td>
            <td><strong>${escapeHtml(a.nama_aset)}</strong><br/><small style="color:var(--text-muted)">${escapeHtml(a.kelompok_juknis)} (${escapeHtml(a.kategori_kib)})</small></td>
            <td>${escapeHtml(a.kondisi)}</td>
            <td><strong>${formatRupiah(getAssetEffectiveValue(a))}</strong></td>
            <td><button type="button" class="btn btn-soft-danger btn-sm" onclick="openSingleDeleteModal('${a.id_aset}')">Hapus</button></td>
          </tr>
        `;
      }).join("");

      const historyRows = appState.deletedAssets.map((h, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${escapeHtml(h.tanggal_penghapusan)}</td>
          <td><strong>${escapeHtml(h.nama_aset)}</strong><br/><small style="color:var(--text-muted)">Kode: ${escapeHtml(h.kode_barang)} • Urut: ${escapeHtml(h.no_urut_pendaftaran || "-")}</small></td>
          <td><span class="status-badge st-berat">${escapeHtml(h.jenis_penghapusan)}</span></td>
          <td>${escapeHtml(h.no_sk_ba_dokumen || "-")}<br/><small style="color:var(--text-muted)">${escapeHtml(h.alasan_keterangan)}</small></td>
          <td><strong>${formatRupiah(h.nilai_aset_terakhir)}</strong></td>
          <td><button type="button" class="btn btn-light btn-sm" onclick="restoreDeletedAsset('${h.id_log_hapus}')">↩️ Pulihkan</button></td>
        </tr>
      `).join("");

      return `
        <div class="section-head">
          <div>
            <h2>Penghapusan &amp; Arsip Inventaris Aset</h2>
            <p>Setiap penghapusan aset aktif akan tercatat ke log riwayat (<code>Riwayat_Penghapusan</code>) dan dapat dipulihkan bila terjadi kekeliruan.</p>
          </div>
          <button type="button" class="btn btn-danger btn-sm" onclick="openBulkDeleteModal()" ${selectedDeleteIds.size === 0 ? "disabled" : ""}>
            🗑️ Hapus Terpilih (${selectedDeleteIds.size})
          </button>
        </div>

        <div class="card" style="margin-bottom:20px;">
          <div class="card-header">
            <h3>Daftar Aset Aktif Siap Diproses Penghapusan</h3>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:36px;">Pilih</th>
                  <th>Kode Barang &amp; Lokasi</th>
                  <th>Nama &amp; Golongan Aset</th>
                  <th>Kondisi</th>
                  <th>Nilai Aset</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${activeRows || `<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-muted)">Tidak ada aset aktif.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Riwayat / Arsip Penghapusan Inventaris (${appState.deletedAssets.length})</h3>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>Tanggal</th>
                  <th>Nama &amp; Kode Aset</th>
                  <th>Jenis Penghapusan</th>
                  <th>No. Dokumen &amp; Alasan</th>
                  <th>Nilai Terakhir</th>
                  <th>Pulihkan</th>
                </tr>
              </thead>
              <tbody>
                ${historyRows || `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted)">Belum ada riwayat penghapusan aset.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function toggleDeleteSelection(id, checked) {
      if (checked) selectedDeleteIds.add(id);
      else selectedDeleteIds.delete(id);
      renderCurrentView();
    }

    function openSingleDeleteModal(id) {
      selectedDeleteIds = new Set([id]);
      openBulkDeleteModal();
    }

    function openBulkDeleteModal() {
      const targets = appState.assets.filter((a) => selectedDeleteIds.has(a.id_aset));
      if (!targets.length) return;
      const listHtml = targets.map((t) => `<li><strong>${escapeHtml(t.nama_aset)}</strong> (${escapeHtml(t.kode_barang)}) — ${formatRupiah(getAssetEffectiveValue(t))}</li>`).join("");

      const modal = document.getElementById("delete-modal");
      document.getElementById("delete-modal-body").innerHTML = `
        <h3 style="margin-bottom:10px;color:var(--danger);">Konfirmasi Penghapusan Inventaris (${targets.length} Item)</h3>
        <ul style="margin:0 0 14px 18px;font-size:13px;">${listHtml}</ul>
        <form onsubmit="confirmDeleteAssets(event)">
          <div class="form-group" style="margin-bottom:12px;">
            <label>Jenis Penghapusan *</label>
            <select class="form-control" id="del-jenis" required>
              <option value="Penghapusan Aset Rusak Berat / Tidak Terpakai">Penghapusan Aset Rusak Berat / Tidak Terpakai</option>
              <option value="Barang Hilang / Tidak Ditemukan">Barang Hilang / Tidak Ditemukan</option>
              <option value="Pemindahtanganan / Hibah / Penyerahan">Pemindahtanganan / Hibah / Penyerahan</option>
              <option value="Koreksi Salah Input / Duplikasi">Koreksi Salah Input / Duplikasi</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label>Nomor SK / Berita Acara / Dokumen Pendukung</label>
            <input type="text" class="form-control" id="del-nodok" placeholder="Contoh: BA-HAPUS-01/WWT/2026" />
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label>Alasan / Keterangan Penghapusan *</label>
            <textarea rows="2" class="form-control" id="del-alasan" required placeholder="Jelaskan alasan penghapusan aset..."></textarea>
          </div>
          <div class="form-group" style="margin-bottom:16px;">
            <label>Diproses Oleh</label>
            <input type="text" class="form-control" id="del-petugas" value="${escapeAttr(appState.settings.nama_pengurus_aset)}" />
          </div>
          <div style="display:flex;justify-content:flex-end;gap:10px;">
            <button type="button" class="btn btn-light" onclick="closeModal('delete-modal')">Batal</button>
            <button type="submit" class="btn btn-danger">Ya, Hapus &amp; Arsipkan</button>
          </div>
        </form>
      `;
      modal.classList.add("open");
    }

    async function confirmDeleteAssets(e) {
      e.preventDefault();
      const jenis = document.getElementById("del-jenis").value;
      const nodok = document.getElementById("del-nodok").value.trim();
      const alasan = document.getElementById("del-alasan").value.trim();
      const petugas = document.getElementById("del-petugas").value.trim();
      const today = new Date().toISOString().slice(0, 10);

      const toDelete = appState.assets.filter((a) => selectedDeleteIds.has(a.id_aset));
      const logs = toDelete.map((a) => ({
        id_log_hapus: "DEL-" + String(Date.now()).slice(-6) + "-" + a.id_aset.slice(-3),
        id_aset_dihapus: a.id_aset,
        kode_barang: a.kode_barang,
        no_urut_pendaftaran: a.no_urut_pendaftaran,
        nama_aset: a.nama_aset,
        kelompok_juknis: a.kelompok_juknis,
        kategori_kib: a.kategori_kib,
        nilai_aset_terakhir: getAssetEffectiveValue(a),
        jenis_penghapusan: jenis,
        no_sk_ba_dokumen: nodok,
        alasan_keterangan: alasan,
        dihapus_oleh: petugas,
        tanggal_penghapusan: today,
        snapshot_json_aset: JSON.stringify(a)
      }));

      appState.deletedAssets = [...logs, ...appState.deletedAssets];
      appState.assets = appState.assets.filter((a) => !selectedDeleteIds.has(a.id_aset));
      selectedDeleteIds.clear();

      saveStateToStorage();
      closeModal("delete-modal");
      showToast(`${logs.length} aset dipindahkan ke Riwayat Penghapusan.`, "success");
      await pushActionToGas({ action: "DELETE_ASSETS", logs });
      renderCurrentView();
    }

    async function restoreDeletedAsset(logId) {
      const idx = appState.deletedAssets.findIndex((h) => h.id_log_hapus === logId);
      if (idx === -1) return;
      const item = appState.deletedAssets[idx];
      try {
        const restored = JSON.parse(item.snapshot_json_aset);
        appState.assets.unshift(restored);
        appState.deletedAssets.splice(idx, 1);
        saveStateToStorage();
        showToast(`Aset "${restored.nama_aset}" berhasil dipulihkan ke daftar aktif.`, "success");

    async function syncFromGoogleSheets() {
      const gasUrl = (appState.settings.gas_webapp_url || "").trim();
      if (!gasUrl.startsWith("http")) {
        showToast("URL Google Apps Script belum diisi. Buka menu Juknis & Google Sheets untuk mengaturnya.", "warning");
        return;
      }
      showToast("Menyinkronkan data dari Google Sheets...", "info");
      try {
        const res = await fetch(`${gasUrl}?action=GET_ALL`);
        const data = await res.json();
        if (data.status === "ok") {
          if (Array.isArray(data.assets)) appState.assets = data.assets;
          if (Array.isArray(data.deletedAssets)) appState.deletedAssets = data.deletedAssets;
          if (Array.isArray(data.baLogs) && data.baLogs.length) appState.baLogs = data.baLogs;
          saveStateToStorage();
          showToast("Sinkronisasi dari Google Sheets berhasil.", "success");
          renderCurrentView();
        } else {
          showToast("Respons sheet tidak sesuai format.", "error");
        }
      } catch (err) {
        console.error(err);
        showToast("Gagal terhubung ke Google Sheets. Periksa URL & deployment Web App.", "error");
      }
    }

    async function pushActionToGas(payload) {
      const gasUrl = (appState.settings.gas_webapp_url || "").trim();
      if (!gasUrl.startsWith("http")) return;
      try {
        await fetch(gasUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("GAS push error:", err);
      }
    }

      document.getElementById(id).classList.remove("open");

    function exportAssetsCsv() {
      const headers = [
        "id_aset", "kode_barang", "kode_lokasi", "kode_pengguna", "nama_pengguna_barang",
        "tahun_perolehan", "no_urut_pendaftaran", "kelompok_juknis", "sub_jenis_aset",
        "kategori_kib", "nama_aset", "merk_tipe_spesifikasi", "jumlah_luas_volume",
        "satuan", "asal_usul", "tanggal_perolehan", "nilai_perolehan",
        "nilai_wajar_taksiran", "metode_penilaian", "kondisi", "lokasi_fisik_ruangan",
        "status_dokumen", "status_label", "foto_gdrive_url"
      ];
      const csvLines = [
        headers.join(","),
        ...appState.assets.map((a) =>
          headers.map((h) => `"${String(a[h] ?? "").replace(/"/g, '""')}"`).join(",")
        )
      ];
      const blob = new Blob([csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `Inventaris_Desa_Wuliwutik_5307042006_${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      URL.revokeObjectURL(url);
      showToast("File CSV inventaris berhasil diunduh.", "success");
    }

    function getGoogleAppsScriptCode() {
      return `const SHEET_NAMES = {
  ASSETS: "Aset_Utama",
  DELETED: "Riwayat_Penghapusan",
  BA: "Log_Inventarisasi_BA",
  SETTINGS: "Pengaturan_Wilayah"
};

function doGet(e) {
  const action = (e && e.parameter && e.parameter.action) || "GET_ALL";
  if (action === "GET_ALL") {
    return jsonResponse({
      status: "ok",
      assets: readSheetAsObjects(SHEET_NAMES.ASSETS),
      deletedAssets: readSheetAsObjects(SHEET_NAMES.DELETED),
      baLogs: readSheetAsObjects(SHEET_NAMES.BA)
    });
  }
  return jsonResponse({ status: "ok", message: "API Inventaris Desa Wuliwutik aktif" });
}

function doPost(e) {
  try {
    const body = JSON.parse(e.postData.contents || "{}");
    const action = body.action || "";

    if (action === "UPLOAD_PHOTO") {
      const folder = getTargetFolder(body.folderUrl);
      const bytes = Utilities.base64Decode((body.base64Data || "").split(",").pop());
      const blob = Utilities.newBlob(bytes, body.mimeType || "image/jpeg", body.fileName || "aset_wuliwutik.jpg");
      const file = folder.createFile(blob);
      file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
      return jsonResponse({
        status: "ok",
        fileId: file.getId(),
        url: file.getUrl()
      });
    }

    if (action === "ADD_ASSET" || action === "UPDATE_ASSET") {
      upsertRowByKey(SHEET_NAMES.ASSETS, "id_aset", body.asset);
      return jsonResponse({ status: "ok" });
    }

    if (action === "DELETE_ASSETS") {
      const logs = body.logs || [];
      logs.forEach((log) => {
        upsertRowByKey(SHEET_NAMES.DELETED, "id_log_hapus", log);
        deleteRowByKey(SHEET_NAMES.ASSETS, "id_aset", log.id_aset_dihapus);
      });
      return jsonResponse({ status: "ok" });
    }

    if (action === "RESTORE_ASSET") {
      if (body.asset) upsertRowByKey(SHEET_NAMES.ASSETS, "id_aset", body.asset);
      if (body.id_log_hapus) deleteRowByKey(SHEET_NAMES.DELETED, "id_log_hapus", body.id_log_hapus);
      return jsonResponse({ status: "ok" });
    }

    return jsonResponse({ status: "error", message: "Aksi tidak dikenal" });
  } catch (err) {
    return jsonResponse({ status: "error", message: err.message });
  }
}

function getTargetFolder(folderUrlOrId) {
  if (folderUrlOrId) {
    const match = String(folderUrlOrId).match(/folders\\/([a-zA-Z0-9_-]{10,})/);
    const id = match ? match[1] : String(folderUrlOrId).trim();
    try { return DriveApp.getFolderById(id); } catch (e) {}
  }
  const iter = DriveApp.getFoldersByName("Foto_Aset_Desa_Wuliwutik");
  return iter.hasNext() ? iter.next() : DriveApp.createFolder("Foto_Aset_Desa_Wuliwutik");
}

function readSheetAsObjects(sheetName) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const sh = ss.getSheetByName(sheetName);
  if (!sh || sh.getLastRow() < 2) return [];
  const data = sh.getDataRange().getValues();
  const headers = data[0];
  return data.slice(1).map((row) => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = row[i]; });
    return obj;
  });
}

function upsertRowByKey(sheetName, keyCol, record) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(sheetName);
  const keys = Object.keys(record || {});
  if (!sh) {
    sh = ss.insertSheet(sheetName);
    sh.appendRow(keys);
  }
  const headers = sh.getRange(1, 1, 1, Math.max(1, sh.getLastColumn())).getValues()[0];
  if (!headers[0]) {
    sh.getRange(1, 1, 1, keys.length).setValues([keys]);
  }
  const finalHeaders = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0];
  const keyIdx = finalHeaders.indexOf(keyCol);
  const rowValues = finalHeaders.map((h) => record[h] ?? "");

  if (keyIdx !== -1 && sh.getLastRow() > 1) {
    const colVals = sh.getRange(2, keyIdx + 1, sh.getLastRow() - 1, 1).getValues();
    for (let i = 0; i < colVals.length; i++) {
      if (String(colVals[i][0]) === String(record[keyCol])) {
        sh.getRange(i + 2, 1, 1, rowValues.length).setValues([rowValues]);
        return;
      }
    }
  }
  sh.appendRow(rowValues);
}

function deleteRowByKey(sheetName, keyCol, keyVal) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const sh = ss.getSheetByName(sheetName);
  if (!sh || sh.getLastRow() < 2) return;
  const headers = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0];
  const keyIdx = headers.indexOf(keyCol);
  if (keyIdx === -1) return;
  const vals = sh.getRange(2, keyIdx + 1, sh.getLastRow() - 1, 1).getValues();
  for (let i = vals.length - 1; i >= 0; i--) {
    if (String(vals[i][0]) === String(keyVal)) {
      sh.deleteRow(i + 2);
    }
  }
}

function jsonResponse(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}`;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    renderCurrentView();
  </script>
